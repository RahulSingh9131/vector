services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: vector
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      # App
      VECTOR_PRIMARY.ENV: "local"

      # Server
      VECTOR_SERVER.PORT: "8080"
      VECTOR_SERVER.READ_TIMEOUT: "30"
      VECTOR_SERVER.WRITE_TIMEOUT: "30"
      VECTOR_SERVER.IDLE_TIMEOUT: "60"
      VECTOR_SERVER.CORS_ALLOWED_ORIGINS: "http://localhost:3000"

      # Database (uses the 'postgres' service hostname)
      VECTOR_DATABASE.HOST: "postgres"
      VECTOR_DATABASE.PORT: "5432"
      VECTOR_DATABASE.USER: "postgres"
      VECTOR_DATABASE.PASSWORD: "postgres"
      VECTOR_DATABASE.NAME: "vector"
      VECTOR_DATABASE.SSL_MODE: "disable"
      VECTOR_DATABASE.MAX_OPEN_CONNS: "25"
      VECTOR_DATABASE.MAX_IDLE_CONNS: "25"
      VECTOR_DATABASE.CONN_MAX_LIFETIME: "300"
      VECTOR_DATABASE.CONN_MAX_IDLE_TIME: "300"

      # Auth
      VECTOR_AUTH.SECRET_KEY: "docker-dev-secret"

      # Integration
      VECTOR_INTEGRATION.RESEND_API_KEY: "re_placeholder"

      # Redis (uses the 'redis' service hostname)
      VECTOR_REDIS.ADDRESS: "redis:6379"

      # Observability
      VECTOR_OBSERVABILITY.SERVICE_NAME: "vector"
      VECTOR_OBSERVABILITY.ENVIRONMENT: "development"
      VECTOR_OBSERVABILITY.LOGGING.LEVEL: "debug"
      VECTOR_OBSERVABILITY.LOGGING.FORMAT: "console"
      VECTOR_OBSERVABILITY.LOGGING.SLOW_QUERY_THRESHOLD: "100ms"
      VECTOR_OBSERVABILITY.NEW_RELIC.LICENSE_KEY: ""
      VECTOR_OBSERVABILITY.NEW_RELIC.APP_LOG_FORWARDING_ENABLED: "false"
      VECTOR_OBSERVABILITY.NEW_RELIC.DISTRIBUTED_TRACING_ENABLED: "false"
      VECTOR_OBSERVABILITY.NEW_RELIC.DEBUG_LOGGING: "false"
      VECTOR_OBSERVABILITY.HEALTH_CHECKS.ENABLED: "true"
      VECTOR_OBSERVABILITY.HEALTH_CHECKS.INTERVAL: "30s"
      VECTOR_OBSERVABILITY.HEALTH_CHECKS.TIMEOUT: "5s"
      VECTOR_OBSERVABILITY.HEALTH_CHECKS.CHECKS: "database,redis"

volumes:
  postgres_data:
