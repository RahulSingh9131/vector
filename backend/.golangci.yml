version: "2"

run:
  # Timeout for analysis.
  timeout: 5m

  # Exit code when at least one issue was found.
  issues-exit-code: 1

  # Include test files or not.
  tests: true

# Output configuration options.
output:
  formats:
    text:
      path: stdout
      print-linter-name: true
      print-issued-lines: true

  sort-order:
    - linter
    - file

linters:
  # Start with no linters, enable only what we need.
  default: none

  # Enable specific linters.
  enable:
    # Enabled by default linters:
    - errcheck        # Checking for unchecked errors
    - govet           # Reports suspicious constructs
    - ineffassign     # Detects ineffectual assignments
    - staticcheck     # Advanced Go linter
    - unused          # Checks for unused constants, variables, functions and types

    # Additional recommended linters:
    - gosec           # Inspects source code for security problems
    - misspell        # Finds commonly misspelled English words in comments
    - revive          # Fast, configurable, extensible, flexible, and beautiful linter for Go
    - unconvert       # Remove unnecessary type conversions
    - unparam         # Reports unused function parameters
    - gocyclo         # Computes and checks the cyclomatic complexity of functions
    - goconst         # Finds repeated strings that could be replaced by a constant
    - dupl            # Tool for code clone detection
    - lll             # Reports long lines
    - nakedret        # Finds naked returns in functions greater than a specified function length
    - prealloc        # Finds slice declarations that could potentially be pre-allocated
    - gocritic        # Provides diagnostics that check for bugs, performance and style issues
    - bodyclose       # Checks whether HTTP response body is closed successfully
    - noctx           # Finds sending http request without context.Context
    - rowserrcheck    # Checks whether Err of rows is checked successfully
    - sqlclosecheck   # Checks that sql.Rows and sql.Stmt are closed
    - whitespace      # Detection of leading and trailing whitespace
    - errorlint       # Find code that will cause problems with the error wrapping scheme introduced in Go 1.13

  # Linter-specific settings.
  settings:
    errcheck:
      check-type-assertions: true
      check-blank: true

    govet:
      enable-all: true
      disable:
        - shadow

    gocyclo:
      min-complexity: 15

    dupl:
      threshold: 100

    goconst:
      min-len: 3
      min-occurrences: 3

    misspell:
      locale: US

    lll:
      line-length: 120
      tab-width: 4

    unparam:
      check-exported: false

    nakedret:
      max-func-lines: 30

    prealloc:
      simple: true
      range-loops: true
      for-loops: false

    gocritic:
      enabled-tags:
        - diagnostic
        - style
        - performance
        - experimental
        - opinionated
      disabled-checks:
        - whyNoLint
        - unnamedResult

    revive:
      severity: warning
      enable-all-rules: false
      confidence: 0.8
      rules:
        - name: blank-imports
        - name: context-as-argument
        - name: context-keys-type
        - name: dot-imports
        - name: error-return
        - name: error-strings
        - name: error-naming
        - name: exported
        - name: if-return
        - name: increment-decrement
        - name: var-naming
        - name: var-declaration
        - name: package-comments
        - name: range
        - name: receiver-naming
        - name: time-naming
        - name: unexported-return
        - name: indent-error-flow
        - name: errorf
        - name: empty-block
        - name: superfluous-else
        - name: unused-parameter
        - name: unreachable-code
        - name: redefines-builtin-id

    staticcheck:
      checks: ["all"]

  # Exclusion rules for linters.
  exclusions:
    generated: lax
    rules:
      # Exclude some linters from running on test files.
      - path: _test\.go
        linters:
          - gocyclo
          - errcheck
          - dupl
          - gosec

      # Exclude known linters from partially hard-vendored code.
      - path: vendor/
        linters:
          - gosec
          - dupl

      # Exclude lll issues for long lines with go:generate
      - linters:
          - lll
        source: "^//go:generate "

formatters:
  enable:
    - gofmt
    - goimports

  settings:
    goimports:
      local-prefixes:
        - github.com/RahulSingh9131/vector

issues:
  # Maximum issues count per one linter (0 = no limit).
  max-issues-per-linter: 0

  # Maximum count of issues with the same text (0 = no limit).
  max-same-issues: 0

  # Show only new issues.
  new: false

  # Fix found issues (if supported by the linter).
  fix: false
